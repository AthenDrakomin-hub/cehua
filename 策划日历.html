body { position: relative; }
.header{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:#fff;padding:30px 20px 10px;text-align:center}
.header h1{font-size:26px;margin-bottom:6px;letter-spacing:2px}
.header .subtitle{font-size:14px;opacity:.8}
.toolbar{display:flex;justify-content:center;gap:10px;padding:10px 20px 18px;flex-wrap:wrap;align-items:center}
.btn{padding:6px 16px;border-radius:6px;border:none;font-size:13px;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-edit{background:#FF9800;color:#fff}
.btn-edit.active{background:#4CAF50}
.btn-save{background:#2196F3;color:#fff}
.btn-export{background:#9C27B0;color:#fff}
.btn-import{background:#00897B;color:#fff}
.btn-reset{background:#f44336;color:#fff}
.btn-primary{background:#3F51B5;color:#fff}
.btn-success{background:#4CAF50;color:#fff}
.btn-warning{background:#FF9800;color:#fff}
.btn-danger{background:#f44336;color:#fff}
.btn-dark{background:#616161;color:#fff}

.edit-status{font-size:12px;color:rgba(255,255,255,.7);margin-left:8px}
.month-tabs{display:flex;justify-content:center;gap:0;padding:0 20px;margin-bottom:12px}
.month-tab{padding:10px 36px;font-size:15px;font-weight:600;cursor:pointer;border:none;background:rgba(255,255,255,.15);color:rgba(255,255,255,.7);transition:all .2s;font-family:inherit}
.month-tab:first-child{border-radius:8px 0 0 8px}
.month-tab:last-child{border-radius:0 8px 8px 0}
.month-tab.active{background:#fff;color:#0f3460}
.month-tab:hover:not(.active){background:rgba(255,255,255,.28)}
.view-tabs{display:flex;justify-content:center;gap:0;margin-bottom:12px}
.view-tab{padding:8px 24px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:rgba(255,255,255,.15);color:rgba(255,255,255,.7);transition:all .2s;font-family:inherit}
.view-tab:first-child{border-radius:6px 0 0 6px}
.view-tab:last-child{border-radius:0 6px 6px 0}
.view-tab.active{background:#fff;color:#0f3460}
.view-tab:hover:not(.active){background:rgba(255,255,255,.28)}
.legend{display:flex;justify-content:center;gap:16px;padding:14px 20px;background:#fff;flex-wrap:wrap;border-bottom:1px solid #e8e8e8}
.legend-item{display:flex;align-items:center;gap:6px;font-size:13px}
.legend-dot{width:14px;height:14px;border-radius:3px}
.dot-resource{background:#4CAF50}.dot-marketing{background:#FF9800}.dot-account{background:#2196F3}.dot-maintain{background:#9C27B0}.dot-deposit{background:#E91E63}
.container{max-width:1200px;margin:0 auto;padding:20px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:#fff;border-radius:12px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.cal-header{text-align:center;font-size:13px;font-weight:600;color:#666;padding:8px 4px}
.cal-header.weekend{color:#f44336}
.cal-day{min-height:90px;border-radius:8px;padding:8px 6px;cursor:pointer;transition:all .2s;position:relative;border:2px solid transparent;display:flex;flex-direction:column}
.cal-day:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.cal-day.empty{background:#fafafa;cursor:default}
.cal-day.empty:hover{transform:none;box-shadow:none}
.cal-day .day-num{font-size:18px;font-weight:700;margin-bottom:4px}
.cal-day .day-week{font-size:10px;opacity:.6}
.cal-day .theme{font-size:11px;line-height:1.4;flex-grow:1;overflow:hidden}
.cal-day .phase-tag{font-size:9px;padding:1px 5px;border-radius:3px;color:#fff;display:inline-block;margin-top:3px}
.phase-resource{background:#4CAF50}.phase-marketing{background:#FF9800}.phase-account{background:#2196F3}.phase-maintain{background:#9C27B0}.phase-deposit{background:#E91E63}
.cal-day.resource{background:#E8F5E9;border-color:#4CAF50}
.cal-day.marketing{background:#FFF3E0;border-color:#FF9800}
.cal-day.account{background:#E3F2FD;border-color:#2196F3}
.cal-day.maintain{background:#F3E5F5;border-color:#9C27B0}
.cal-day.deposit{background:#FCE4EC;border-color:#E91E63}
.cal-day .survey-badge{position:absolute;top:4px;right:4px;background:#e91e63;color:#fff;font-size:8px;padding:1px 4px;border-radius:8px}
.cal-day .milestone-badge{position:absolute;top:4px;left:4px;background:#FFD700;color:#333;font-size:8px;padding:1px 4px;border-radius:8px;font-weight:bold}
.cal-day .metric-badge{position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;font-size:8px;padding:1px 4px;border-radius:4px}
body.edit-mode .editable{outline:1px dashed rgba(255,152,0,.4);border-radius:3px;cursor:text;min-height:24px}
body.edit-mode .editable:hover{background:rgba(255,235,59,.2)}
body.edit-mode .editable:focus{background:rgba(255,235,59,.35);outline:2px solid #FF9800}
body.edit-mode .add-btn{display:inline-flex!important}
body.edit-mode .del-btn{display:inline-flex!important}
.add-btn{display:none;align-items:center;padding:4px 12px;font-size:12px;background:#4CAF50;color:#fff;border:none;border-radius:4px;cursor:pointer;font-family:inherit}
.add-btn:hover{background:#388E3C}
.del-btn{display:none;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#f44336;color:#fff;border:none;font-size:12px;cursor:pointer;flex-shrink:0;line-height:1}
.del-btn:hover{background:#d32f2f}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:flex-start;padding:40px 20px;overflow-y:auto}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:12px;max-width:820px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.2);animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
.modal-header{padding:20px 24px;border-radius:12px 12px 0 0;color:#fff;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.modal-header.resource{background:linear-gradient(135deg,#4CAF50,#2E7D32)}
.modal-header.marketing{background:linear-gradient(135deg,#FF9800,#E65100)}
.modal-header.account{background:linear-gradient(135deg,#2196F3,#1565C0)}
.modal-header.maintain{background:linear-gradient(135deg,#9C27B0,#6A1B9A)}
.modal-header.deposit{background:linear-gradient(135deg,#E91E63,#AD1457)}
.modal-header h2{font-size:20px}
.modal-close{background:none;border:none;color:#fff;font-size:28px;cursor:pointer;line-height:1;padding:0 4px}
.modal-close:hover{opacity:.7}
.modal-body{padding:20px 24px;max-height:75vh;overflow-y:auto}
.summary-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.summary-chip{background:#f5f5f5;border-radius:16px;padding:4px 12px;font-size:12px;color:#666}
.summary-chip strong{color:#333}
.section{margin-bottom:20px;border-radius:8px;overflow:hidden;border:1px solid #e0e0e0;position:relative;transition:opacity .3s}
.section-header{padding:10px 14px;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.section-header.storyline-h{background:#E3F2FD;color:#1565C0}
.section-header.course-h{background:#FFF3E0;color:#E65100}
.section-header.scripts-h{background:#E8F5E9;color:#2E7D32}
.section-header.teacher-h{background:#F3E5F5;color:#6A1B9A}
.section-header.manager-h{background:#F3E5F5;color:#6A1B9A}
.section-header.small-h{background:#FFF8E1;color:#F57F17}
.section-header.metric-h{background:#E8EAF6;color:#283593}
.section-header.review-h{background:#E0F2F1;color:#00695C}
.section-header.log-h{background:#E8EAF6;color:#283593}
.section.completed-section{opacity:.65}
.section.completed-section::after{content:'✅ 已完成';position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:#4CAF50;font-weight:bold}
.section-toggle{font-size:12px;opacity:.7}
.section-body{padding:12px 14px;background:#fafafa}
.section-body.collapsed{display:none}
.storyline-text{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.8;padding:8px;background:#fff;border-radius:4px}
.course-item{background:#fff;border-radius:6px;padding:10px 12px;margin-bottom:8px;position:relative}
.course-item-title{font-weight:600;font-size:13px;color:#333;margin-bottom:6px;white-space:pre-wrap;word-break:break-word}
.course-item-detail{font-size:12px;color:#666;white-space:pre-wrap;word-break:break-word;line-height:1.7;min-height:20px}
.course-empty{color:#999;font-size:12px;font-style:italic;padding:8px 0}
.script-item{display:flex;align-items:flex-start;gap:6px;margin-bottom:6px;background:#fff;border-radius:4px;padding:6px 10px}
.script-num{font-weight:700;color:#4CAF50;flex-shrink:0;min-width:24px}
.script-content{flex-grow:1;font-size:12px;white-space:pre-wrap;word-break:break-word;min-height:20px;line-height:1.7}
.role-text{white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.7;min-height:60px;padding:8px;background:#fff;border-radius:4px}
.role-text.empty-text{color:#999;font-style:italic}
.survey-note{background:#FFF8E1;border-left:3px solid #FFC107;padding:8px 12px;border-radius:0 4px 4px 0;font-size:12px;color:#795548;margin-bottom:12px}
.metric-input{width:80px;padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px;text-align:right}
.metric-input:focus{border-color:#3F51B5;outline:none}
.review-text{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.7;padding:8px;background:#fff;border-radius:4px;min-height:60px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:2000;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.edit-hint{background:#FFF3E0;border:1px dashed #FF9800;border-radius:4px;padding:6px 12px;font-size:12px;color:#E65100;margin-bottom:12px;display:none}
body.edit-mode .edit-hint{display:block}
.funnel-panel{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.funnel-panel h3{font-size:16px;margin-bottom:16px;color:#1a1a2e}
.funnel-stages{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.funnel-stage{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;min-width:120px}
.funnel-bar{width:100%;height:40px;background:linear-gradient(135deg,#3F51B5,#283593);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:bold;font-size:14px}
.funnel-label{font-size:12px;color:#666;text-align:center}
.funnel-input{width:100%;padding:4px 8px;border:1px solid #ddd;border-radius:4px;font-size:12px;text-align:center;margin-top:4px}
.funnel-input:focus{border-color:#3F51B5;outline:none}
.script-lib-panel{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.script-lib-panel h3{font-size:16px;margin-bottom:16px;color:#1a1a2e}
.script-lib-category{margin-bottom:16px}
.script-lib-category h4{font-size:14px;color:#333;margin-bottom:8px;padding:8px;background:#f5f5f5;border-radius:4px}
.script-lib-item{display:flex;align-items:center;gap:8px;padding:8px;background:#fafafa;border-radius:4px;margin-bottom:4px}
.script-lib-content{flex:1;font-size:12px;white-space:pre-wrap}
.ai-panel{position:fixed;right:20px;bottom:80px;width:380px;max-height:600px;background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.15);z-index:1500;display:none;flex-direction:column;overflow:hidden}
.ai-panel.show{display:flex}
.ai-panel h3{padding:12px 16px;background:linear-gradient(135deg,#3F51B5,#5C6BC0);color:#fff;margin:0;font-size:15px}
.ai-chat-history{flex:1;overflow-y:auto;padding:12px;max-height:400px}
.ai-message{margin-bottom:12px;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.ai-message.user{background:#e3f2fd;text-align:right}
.ai-message.assistant{background:#f5f5f5}
.ai-message.system{background:#fff3e0;color:#e65100;font-size:12px}
.ai-message.loading{background:#f0f0f0;color:#999}
.ai-input-area{padding:12px;border-top:1px solid #eee}
.ai-input-area textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:13px;resize:none;font-family:inherit;line-height:1.5}
.ai-input-area textarea:focus{outline:none;border-color:#3F51B5}
.ai-config-btn{margin:8px 12px;padding:6px;background:#f5f5f5;border:1px solid #ddd;border-radius:6px;font-size:12px;cursor:pointer;color:#666}
.ai-config-btn:hover{background:#eee}
.btn-ai{background:linear-gradient(135deg,#3F51B5,#5C6BC0);color:#fff}
.btn-ai:hover{background:linear-gradient(135deg,#303F9F,#3949AB)}
.role-filter{display:flex;gap:10px;justify-content:center;margin-bottom:16px;flex-wrap:wrap}
.role-btn{padding:8px 20px;border-radius:20px;border:2px solid #ddd;background:#fff;cursor:pointer;font-size:13px;font-family:inherit;transition:all .2s}
.role-btn.active{border-color:#3F51B5;background:#3F51B5;color:#fff}
.role-btn:hover{border-color:#3F51B5}
.report-panel{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.report-panel h3{font-size:16px;margin-bottom:16px;color:#1a1a2e}
.report-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.report-card{background:#f5f5f5;border-radius:8px;padding:12px;text-align:center}
.report-card .value{font-size:24px;font-weight:bold;color:#3F51B5}
.report-card .label{font-size:12px;color:#666;margin-top:4px}
.milestone-today{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,215,0,.7)}50%{box-shadow:0 0 0 10px rgba(255,215,0,0)}}
.todo-panel{background:#fff;border-radius:12px;padding:16px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.08)}

.todo-item{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f5f5f5;border-radius:6px;margin-bottom:6px;border-left:3px solid #3F51B5}
.todo-item.done{opacity:.5;text-decoration:line-through}
.todo-checkbox{width:18px;height:18px;cursor:pointer;accent-color:#3F51B5}
.todo-text{flex:1;font-size:13px}
.todo-del{background:none;border:none;color:#f44336;cursor:pointer;font-size:16px;padding:0 4px}
.batch-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:2000;display:none;justify-content:center;align-items:center}
.batch-modal.active{display:flex}
.batch-modal-content{background:#fff;border-radius:12px;padding:24px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto}
body.dark .batch-modal-content{background:#16213e}
.batch-modal-content h3{font-size:16px;margin-bottom:16px;color:#1a1a2e}
body.dark .batch-modal-content h3{color:#90caf9}
.batch-modal-content label{font-size:12px;color:#666;display:block;margin-bottom:4px;margin-top:10px}

.batch-modal-content input{width:100%;padding:6px 10px;border:1px solid #ddd;border-radius:4px;font-size:13px}
body.dark .batch-modal-content input{background:#1a1a2e;border-color:#2a2a4a;color:#e0e0e0}
.sensitive-warn{color:#f44336;font-size:11px;margin-top:4px}
.dark-toggle{position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;font-size:20px;z-index:999;box-shadow:0 2px 12px rgba(0,0,0,.2);background:#fff}

.log-panel{background:#fff;border-radius:12px;padding:16px;margin-bottom:20px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
.log-panel h3{font-size:15px;margin-bottom:12px;color:#1a1a2e}
.log-entry{padding:6px 10px;border-left:3px solid #3F51B5;background:#f9f9f9;margin-bottom:4px;font-size:11px;color:#666}
body.dark .log-entry{background:#1a1a2e;color:#aaa}
.chart-container{margin-top:16px}
.chart-container canvas{width:100%!important;max-height:250px}
.week-compare{display:flex;gap:20px;margin-top:16px;flex-wrap:wrap}
.week-card{flex:1;min-width:200px;background:#f5f5f5;border-radius:8px;padding:12px}
body.dark .week-card{background:#1a1a2e}
.week-card h4{font-size:13px;color:#333;margin-bottom:8px}
body.dark .week-card h4{color:#ccc}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function addLog(msg){operationLog.unshift({time:new Date().toLocaleString(),msg:msg});if(operationLog.length>100)operationLog.pop();saveLocal()}
function pushUndo(){try{undoStack.push(JSON.stringify({allData:allData,funnelData:funnelData,scriptLib:scriptLib}));if(undoStack.length>MAX_UNDO)undoStack.shift()}catch(e){}}
function undo(){if(undoStack.length===0){showToast('没有可撤销的操作');return}var state=JSON.parse(undoStack.pop());allData=state.allData;funnelData=state.funnelData;scriptLib=state.scriptLib;dayData=JSON.parse(JSON.stringify(allData[currentMonth]));renderCalendar();if(currentModalDay)renderModal(currentModalDay);showToast('已撤销 ✓');addLog('撤销操作')}

.depositAmount||0)+'" onchange="updateMetric('+day+',\'depositAmount\',this.value)" /></div>';h+='<div><label style="font-size:12px;color:#666">群活跃率(%)</label><input type="number" class="metric-input" value="'+(data.activeRate||0)+'" onchange="updateMetric('+day+',\'activeRate\',this.value)" /></div>';h+='<div style="grid-column:span 2"><label style="font-size:12px;color:#666">负责人</label><input type="text" class="metric-input" style="width:100%;text-align:left" placeholder="输入负责人姓名" value="'+esc(data.owner||'')+'" onchange="updateMetric('+day+',\'owner\',this.value)" /></div>';h+='</div></div></div>';h+='<div class="section" id="section-storyline-'+day+'"><div class="section-header storyline-h" onclick="toggleSection(this)">📌 当日主线策划 <span class="section-toggle">▼ 收起</span></div><div class="section-body"><div class="storyline-text editable" contenteditable="false" data-edit="storyline" data-day="'+day+'">'+esc(data.storyline)+'</div></div></div>';h+='<div class="section" id="section-course-'+day+'"><div class="section-header course-h" onclick="toggleSection(this)">📚 当日课程内容 <span class="section-toggle">▼ 收起</span></div><div class="section-body">';if(data.courseContent&&data.courseContent.length>0){data.courseContent.forEach(function(c,ci){h+='<div class="course-item"><button class="del-btn" onclick="delCourse('+day+','+ci+')" title="删除课程">×</button><div class="course-item-title editable" contenteditable="false" data-edit="courseTitle" data-day="'+day+'" data-idx="'+ci+'">'+esc(c.title)+'</div><div class="course-item-detail editable" contenteditable="false" data-edit="courseDetail" data-day="'+day+'" data-idx="'+ci+'">'+esc(c.detail)+'</div></div>'});}else{h+='<div class="course-empty">（暂无课程内容，点击编辑模式后添加）</div>'}h+='<button class="add-btn" onclick="addCourse('+day+')">+ 添加课程</button>';h+='</div></div>';h+='<div class="section" id="section-scripts-'+day+'"><div class="section-header scripts-h" onclick="toggleSection(this)">💬 大群活跃话术 <span class="section-toggle">▼ 收起</span function attachEditListeners(){document.querySelectorAll('.editable').forEach(function(el){if(el._attached)return;el._attached=true;el.addEventListener('blur',function(){handleEdit(this)})})}
function handleEdit(el){var edit=el.dataset.edit;var d=el.dataset.day;if(!d||!dayData[d])return;var data=dayData[d];if(edit==='theme'){data.theme=el.textContent.trim()}else if(edit==='storyline'){data.storyline=el.textContent.trim()}else if(edit==='courseTitle'){var i=parseInt(el.dataset.idx);if(!isNaN(i)&&data.courseContent&&data.courseContent[i]){data.courseContent[i].title=el.textContent.trim()}}else if(edit==='courseDetail'){var i=parseInt(el.dataset.idx);if(!isNaN(i)&&data.courseContent&&data.courseContent[i]){data.courseContent[i].detail=el.textContent.trim()}}else if(edit==='script'){var i=parseInt(el.dataset.idx);if(!isNaN(i)&&data.groupScripts&&data.groupScripts[i]){data.groupScripts[i].content=el.textContent.trim()}}else if(edit==='teacherScripts'){data.teacherScripts=el.textContent.trim();updateEmptyClass(el,data.teacherScripts)}else if(edit==='managerScripts'){data.managerScripts=el.textContent.trim();updateEmptyClass(el,data.managerScripts)}else if(edit==='smallGroupScripts'){data.smallGroupScripts=el.textContent.trim();updateEmptyClass(el,data.smallGroupScripts)}else if(edit==='dayReview'){data.dayReview=el.textContent.trim()}else if(edit==='nextPrep'){data.nextPrep=el.textContent.trim()}allData[currentMonth]=dayData;autoSave();checkSensitiveWords(data);updateSectionCompletion(d)}
function updateMetric(day,key,value){var d=String(day);if(!dayData[d])return;if(key==='owner'){dayData[d][key]=value}else{dayData[d][key]=Math.max(0,parseInt(value)||0)}allData[currentMonth]=dayData;autoSave();renderCalendar();if(currentModalDay==day)renderModal(day)}

function renderTrendChart(){var canvas=document.getElementById('trendChart');if(!canvas)return;var ctx=canvas.getContext('2d');var isDark=document.body.classList.contains('dark');canvas.width=canvas.parentElement.offsetWidth;canvas.height=200;ctx.clearRect(0,0,canvas.width,canvas.height);var dates=Object.keys(dayData).sort();var leadsData=dates.map(function(k){return dayData[k].leadsAdded||0});var depositData=dates.map(function(k){return dayData[k].depositAmount||0});var maxVal=Math.max.apply(null,leadsData.concat(depositData))||1;var barW=canvas.width/(dates.length*2);dates.forEach(function(k,i){var x=i*barW*2+barW*.3;var h1=(leadsData[i]/maxVal)*150;ctx.fillStyle=isDark?'#4CAF50':'#4CAF50';ctx.fillRect(x,canvas.height-h1-20,barW*.8,h1);var h2=(depositData[i]/maxVal)*150;ctx.fillStyle=isDark?'#E91E63':'#E91E63';ctx.fillRect(x+barW*1.2,canvas.height-h2-20,barW*.8,h2)});ctx.fillStyle=isDark?'#aaa':'#666';ctx.font='10px Microsoft YaHei';ctx.textAlign='center';dates.forEach(function(k,i){var x=i*barW*2+barW;ctx.fillText(k+'.1',x,canvas.height-2)})}
function renderWeekCompare(){var h='';var week1Keys=Object.keys(dayData).filter(function(k){return parseInt(k)>=12&&parseInt(k)<=18}).sort();var week2Keys=Object.keys(dayData).filter(function(k){return parseInt(k)>=19&&parseInt(k)<=25}).sort();function calcWeek(keys){var leads=0,group=0,account=0,deposit=0;keys.forEach(function(k){var d=dayData[k];leads+=d.leadsAdded||0;group+=d.groupJoined||0;account+=d.accountOpened||0;deposit+=d.depositAmount||0});return{leads:leads,group:group,account:account,deposit:deposit}}var w1=calcWeek(week1Keys);var w2=calcWeek(week2Keys);function compare(cur,prev){if(!prev)return{text:'N/A',cls:''};var pct=Math.round(((cur-prev)/prev)*100);if(pct>0)return{text:'↑ '+pct+'%',cls:'up'};if(pct<0)return{text:'↓ '+Math.abs(pct)+'%',cls:'down'};return{text:'— 持平',cls:''}}var items=[{label:'加粉',c1:w1.leads,c2:w2.leads},{label:'进群',c1:w1.group,c2:w2.group},{label:'开户',c1:w1.account,c2:w2.account},{label:'入金',c1:w1.deposit,c2:w2.deposit}];items.forEach(function(item){var cmp=compare(item.c2,item.c1);h+='<div class="week-card"><h4>'+item.label+'</h4><div class="compare-value">'+item.c2+'</div><div class="compare-change '+cmp.cls+'">'+cmp.text+'</div></div>'});document.getElementById('weekCompare').innerHTML=h}

function pullFromGitHubRepo(){if(!GITHUB_TOKEN){showToast('请先配置GitHub Token');return}fetch('https://api.github.com/repos/'+GITHUB_REPO+'/contents/'+encodeURIComponent(GITHUB_FILE_PATH),{headers:{'Authorization':'token '+GITHUB_TOKEN}}).then(r=>r.json()).then(d=>{var content=atob(d.content);var overrideMatch=content.match(/window\.__OVERRIDE__=(\{.*?\});/);if(overrideMatch){try{var data=JSON.parse(overrideMatch[1]);allData=data;dayData=JSON.parse(JSON.stringify(allData[currentMonth]));localStorage.setItem(STORAGE_KEY,JSON.stringify({allData:allData,funnelData:funnelData,scriptLib:scriptLib,operationLog:operationLog,todayTodos:todayTodos,savedAt:new Date().toISOString()}));renderCalendar();renderTodos();renderTodayBanner();renderOperationLog();showToast('已从GitHub仓库拉取数据 ✓');addLog('从GitHub仓库拉取数据')}catch(e){showToast('解析数据失败')}}else{showToast('未找到嵌入数据')}GITHUB_SHA=d.sha}).catch(e=>showToast('拉取失败: '+e.message))}
function syncToGitHub(){if(!GITHUB_GIST_ID||!GITHUB_TOKEN){showToast('请先配置GitHub');configGithub();return}var data={allData:allData,funnelData:funnelData,scriptLib:scriptLib,operationLog:operationLog,todayTodos:todayTodos,updatedAt:new Date().toISOString()};fetch('https://api.github.com/gists/'+GITHUB_GIST_ID,{method:'PATCH',headers:{'Authorization':'token '+GITHUB_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({description:'日斗投资运营日历数据备份 - '+new Date().toLocaleString(),files:{'calendar.json':{content:JSON.stringify(data,null,2)}}})}).then(r=>{if(r.ok){showToast('云端同步成功 ✓');document.getElementById('cloudStatus').textContent='☁️ 已同步云端';document.getElementById('cloudStatus').style.color='#4CAF50';addLog('同步云端成功')}else{return r.json().then(d=>{throw new Error(d.message||'同步失败')})}}).catch(e=>{showToast('同步失败: '+e.message);document.getElementById('cloudStatus').textContent='⚠ 同步失败';document.getElementById('cloudStatus').style.color='#f44336';addLog('云端同步失败')})}
function syncFromGitHub(){if(!GITHUB_GIST_ID||!GITHUB_TOKEN){return}fetch('https://api.github.com/gists/'+GITHUB_GIST_ID,{headers:{'Authorization':'token '+GITHUB_TOKEN}}).then(r=>r.json()).then(d=>{if(!d.files||!d.files['calendar.json'])throw new Error('未找到数据文件');var data=JSON.parse(d.files['calendar.json'].content);if(data.allData){allData=data.allData;dayData=JSON.parse(JSON.stringify(allData[currentMonth]))}if(data.funnelData)funnelData=data.funnelData;if(data.scriptLib)scriptLib=data.scriptLib;if(data.operationLog)operationLog=data.operationLog;if(data.todayTodos)todayTodos=data.todayTodos;localStorage.setItem(STORAGE_KEY,JSON.stringify({allData:allData,funnelData:funnelData,scriptLib:scriptLib,operationLog:operationLog,todayTodos:todayTodos,savedAt:new Date().toISOString()}));renderCalendar();renderTodos();renderTodayBanner();renderOperationLog();showToast('已从云端恢复数据 ✓');addLog('从云端恢复数据')}).catch(e=>{showToast('云端数据读取失败: '+e.message)})}
</script>
</body>
</html>
